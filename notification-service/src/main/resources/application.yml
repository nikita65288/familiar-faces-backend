server:
  port: 9003

spring:
  application:
    name: notification-service


  profiles:
    active: local # default value

  config:
    # Note: use "SPRING_CLOUD_CONFIG_URI=..." on prod to override this
    import: "optional:configserver:http://localhost:8888/"

  kafka:
    consumer:
      group-id: ${spring.application.name}-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.github.nikita65288.*"
        spring.json.value.default.type: "com.github.nikita65288.dto.event.MessageSentEvent"