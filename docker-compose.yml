services:
  # -----------------------------------------------------------------
  # RELATIONAL DATABASE (PostgreSQL)
  # Хранит пользователей, сообщения, диалоги
  # -----------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: sn-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
#      POSTGRES_DB: social_network_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sn-network

  # -----------------------------------------------------------------
  # NOSQL DATABASE (MongoDB)
  # Хранит фотографии и метаданные медиа-файлов
  # -----------------------------------------------------------------
  mongo:
    image: mongo:6.0
    container_name: sn-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: media_db
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sn-network

  # -----------------------------------------------------------------
  # CACHE & SESSION STORE (Redis)
  # Хранит кэш профилей, черные списки токенов
  # -----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sn-redis
    ports:
      - "6379:6379"
    networks:
      - sn-network

  # -----------------------------------------------------------------
  # MESSAGE BROKER (KRaft)
  # Асинхронная коммуникация (отправка уведомлений)
  # -----------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: sn-kafka-kraft
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - sn-network

  # -----------------------------------------------------------------
  # ELK STACK (Elasticsearch + Logstash + Kibana)
  # Сбор и просмотр логов
  # -----------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.1
    container_name: sn-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - sn-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.9.1
    container_name: sn-logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "5044:5044" # Порт для приема логов от сервисов
    depends_on:
      - elasticsearch
    networks:
      - sn-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.9.1
    container_name: sn-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - sn-network

  # -----------------------------------------------------------------
  # NGINX
  # Балансировщик нагрузки
  # -----------------------------------------------------------------
  nginx:
    image: bitnami/nginx:latest
    container_name: sn-nginx
    ports:
      - "80:8080"
    volumes:
      - ./nginx/nginx.conf:/opt/bitnami/nginx/conf/nginx.conf:ro
    # Для обращения к локальному порту
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sn-network

  # -----------------------------------------------------------------
  # Jenkins
  # Автоматический сборщик
  # -----------------------------------------------------------------

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    user: root

# -----------------------------------------------------------------
# VOLUMES & NETWORKS
# -----------------------------------------------------------------
volumes:
  postgres_data:
  mongo_data:
  es_data:
  jenkins_home:

networks:
  sn-network:
    driver: bridge