server:
  port: 9001

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5433/user_service_db
    username: user
    password: password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/changelog-root.xml
    url: jdbc:postgresql://localhost:5433/user_service_db
    user: user
    password: password
    default-schema: public


  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/