server:
  port: 9001

spring:
  application:
    name: user-service

  profiles:
    active: local # default value

  config:
    # Note: use "SPRING_CLOUD_CONFIG_URI=..." on prod to override this
    import: "optional:configserver:http://localhost:8888/"

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/changelog-root.xml
    default-schema: public

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE