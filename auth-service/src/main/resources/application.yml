server:
  port: 9000

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_service_db
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/changelog-root.xml
    url: jdbc:postgresql://localhost:5433/auth_service_db
    user: user
    password: password
    default-schema: public

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Custom JWT settings
jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437 # 256 bit
  expiration: 86400000 # 24 hours