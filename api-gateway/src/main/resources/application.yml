server:
  port: 8080

spring:
  application:
    name: api-gateway

  profiles:
    active: local # default value

  config:
    # Note: use "SPRING_CLOUD_CONFIG_URI=..." on prod to override this
    import: "optional:configserver:http://localhost:8888/"

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE # lb = Load Balancer
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**
          filters:
            - AuthenticationFilter

        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/chats/**
          filters:
            - AuthenticationFilter

        # WebSockets route
        - id: chat-service-ws
          uri: lb:ws://CHAT-SERVICE
          predicates:
            - Path=/ws/**

management:
  endpoints:
    web:
      exposure:
        include: "health,info,env,threshold"
  tracing:
    sampling:
      probability: 1.0