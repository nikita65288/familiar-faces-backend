server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE # lb = Load Balancer
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**
          filters:
            - AuthenticationFilter

        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/chats/**
          filters:
            - AuthenticationFilter

        # WebSockets route
        - id: chat-service-ws
          uri: lb:ws://CHAT-SERVICE
          predicates:
            - Path=/ws/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437 # 256 bit

management:
  endpoints:
    web:
      exposure:
        include: "health,info,env,threshold" # Можно "*" для теста, но лучше перечислить
  tracing:
    sampling:
      probability: 1.0